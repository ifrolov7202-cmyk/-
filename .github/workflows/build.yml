name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          cd infinite-stamina && chmod +x gradlew && ./gradlew build --no-daemon --stacktrace 2>&1 | tee -a ../build.log
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir logout && cp build.log logout/ || true
          cd logout
          git init -q -b buildlog
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Build log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: martialarts-jar
          path: |
            build/libs/*.jar
            infinite-stamina/build/libs/*.jar
      - name: Publish jar to 'builds' branch
        run: |
          mkdir out && cp build/libs/*.jar out/ && cp infinite-stamina/build/libs/*.jar out/
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
