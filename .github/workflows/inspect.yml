name: Inspect compat mods

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download and inspect jars
        run: |
          mkdir -p out jars
          cd jars
          dl() { curl -fsSL --retry 3 -o "$1.jar" "$2" || echo "FAILED $1 $2" >> ../out/failed.txt; }
          dl wom171 "https://cdn.modrinth.com/data/oWx9p4ug/versions/nf0AyjKh/WeaponsOfMiracles-2.0.171-mc1.20.1-forge.jar"
          dl wom "https://cursemaven.com/curse/maven/weapons-of-miracles-epicfight-918614/7477498/weapons-of-miracles-epicfight-918614-7477498.jar"
          dl nightfall "https://cursemaven.com/curse/maven/epicfight-nightfall-1307848/7681377/epicfight-nightfall-1307848-7681377.jar"
          for n in wom171 wom nightfall; do
            d="x_$n"; mkdir -p "$d"; (cd "$d" && unzip -q -o "../$n.jar" || true)
          done
          # WoM 2.0.171: mods.toml + animations list
          cat x_wom171/META-INF/mods.toml > ../out/wom171_mods.toml 2>/dev/null || true
          find x_wom171 -path '*animmodels/animations*' -name '*.json' | sed 's#^x_wom171/##' | sort > ../out/wom171_animations.txt
          javap -cp x_wom171 reascer.wom.gameasset.WOMAnimations > ../out/wom171_fields.txt 2>&1 || true
          # bytecode of WOMAnimations (both versions) for kicks/punch/dodges
          for n in wom171 wom; do
            javap -c -p -constants -cp "x_$n" reascer.wom.gameasset.WOMAnimations > "../out/${n}_WOMAnimations_bytecode.txt" 2>&1 || true
            javap -c -p -constants -cp "x_$n" reascer.wom.gameasset.colliders.WOMWeaponColliders > "../out/${n}_colliders_bytecode.txt" 2>&1 || true
            javap -p -cp "x_$n" reascer.wom.animation.attacks.BasicMultipleAttackAnimation reascer.wom.animation.dodges.CancelableDodgeAnimation > "../out/${n}_types.txt" 2>&1 || true
          done
          # Nightfall: classes that mention dodge/step animation paths
          grep -rla "perfect_dodge\|biped/dodge/step" x_nightfall --include=*.class | sed 's#^x_nightfall/##; s#\.class$##; s#/#.#g' > ../out/nightfall_dodge_classes.txt || true
          while read -r c; do
            echo "=== $c"; javap -c -p -constants -cp x_nightfall "$c" 2>/dev/null
          done < ../out/nightfall_dodge_classes.txt > ../out/nightfall_dodge_bytecode.txt || true
          ls -la ../out
      - name: Publish results to 'inspect' branch
        if: always()
        run: |
          cd out
          git init -q -b inspect
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Inspect results 2"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" inspect
