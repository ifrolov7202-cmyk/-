name: Smoke test server

on:
  workflow_dispatch:
    inputs:
      extra:
        description: "Also load Battle Arts and Weapons of Miracles"
        default: "true"
      selftest:
        description: "Run the in-server self-test (combos, hold-attack rush, arts)"
        default: "true"
      av:
        description: "Load the player's combat mod set (.github/user-combat-mods.txt, by sha1) incl. EpicFight: Annoying Villagers"
        default: "false"
      ef17:
        description: "With av: Epic Fight 20.14.17 instead of the player's Epic Fight, without Battle Arts"
        default: "false"
      backport:
        description: "With av: EpicFight: Annoying Villagers backported to Epic Fight 20.14.16 (branch av-backport) instead of the player's file"
        default: "false"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Get built mod
        run: |
          mkdir -p out
          git clone -q --depth 1 -b builds "https://github.com/${{ github.repository }}.git" built
          ls -la built
          BUILT=$(git -C built log -1 --format=%s)
          echo "builds branch: $BUILT, this run: ${GITHUB_SHA::7}" | tee out/built_from.txt
          case "$BUILT" in *"${GITHUB_SHA::7}"*) ;; *) echo "builds branch is not from this commit"; exit 1;; esac
      - uses: actions/checkout@v4
        if: github.event.inputs.selftest == 'true'
        with:
          path: src
      - name: Build self-test mod
        if: github.event.inputs.selftest == 'true'
        run: |
          cd src
          chmod +x gradlew
          set -o pipefail
          ./gradlew -Pselftest selftestJar --no-daemon --stacktrace 2>&1 | tee ../out/selftest_build.log
          ls -la build/selftest
      - name: Install Forge server and mods
        run: |
          mkdir -p server/mods
          cd server
          for FV in 47.4.28 47.4.10 47.4.0 47.3.0; do
            if curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-$FV/forge-1.20.1-$FV-installer.jar"; then echo "$FV" > ../out/forge_version.txt; break; fi
          done
          java -jar installer.jar --installServer > ../out/installer.log 2>&1 || (tail -50 ../out/installer.log; exit 1)
          cp ../built/ba_martialarts.jar mods/
          if [ -f ../src/build/selftest/ba_martialarts_selftest.jar ]; then cp ../src/build/selftest/ba_martialarts_selftest.jar mods/; fi
          cat > dl.py <<'EOF'
          import json, sys, urllib.request
          def versions(project):
              with urllib.request.urlopen(f"https://api.modrinth.com/v2/project/{project}/version") as r:
                  return json.load(r)
          def get(project, pred, name):
              for v in versions(project):
                  if 'forge' in v['loaders'] and '1.20.1' in v['game_versions'] and pred(v['version_number']):
                      f = next((f for f in v['files'] if f.get('primary')), v['files'][0])
                      urllib.request.urlretrieve(f['url'], 'mods/' + f['filename'])
                      print(name, v['version_number'], f['filename'])
                      return
              print('NOT FOUND', name); sys.exit(1)
          if sys.argv[2] != 'true':
              get('epic-fight', lambda n: n.startswith('20.14.16'), 'Epic Fight')
          if sys.argv[2] == 'true':
              # ровно те файлы, что у игрока: ищем по sha1 на Modrinth
              missing = []
              for line in open('../src/.github/user-combat-mods.txt'):
                  sha, name = line.strip().split(' ', 1)
                  if sys.argv[3] == 'true' and (name.startswith('epic-fight-20') or name.startswith('BattleArts-')):
                      print('skip (ef17)', name)
                      continue
                  if sys.argv[4] == 'true' and name.startswith('EpicFight-AnnoyingVillagers'):
                      urllib.request.urlretrieve('https://raw.githubusercontent.com/ifrolov7202-cmyk/-/av-backport/EpicFight-AnnoyingVillagers-1.20.1-1.5.2-ef20.14.16.jar', 'mods/EpicFight-AnnoyingVillagers-backport.jar')
                      print('backport', name, '-> av-backport branch')
                      continue
                  try:
                      with urllib.request.urlopen(f"https://api.modrinth.com/v2/version_file/{sha}?algorithm=sha1") as r:
                          v = json.load(r)
                      f = next(f for f in v['files'] if f['hashes']['sha1'] == sha)
                      urllib.request.urlretrieve(f['url'], 'mods/' + f['filename'])
                      print('modrinth', name, '->', f['filename'])
                  except Exception as e:
                      print('NOT ON MODRINTH', name, e)
                      missing.append(name)
              open('../out/missing.txt', 'w').write(''.join(m + '\n' for m in missing))
          get('7baP43pD', lambda n: n.startswith('20.14.16'), 'Battle Arts API')
          av = sys.argv[2] == 'true'
          if sys.argv[1] == 'true' and not av:
              get('Dd6vT4jF', lambda n: n.startswith('20.14.16.10'), 'Battle Arts')
              get('weapons-of-miracles', lambda n: n.startswith('2.0.171'), 'Weapons of Miracles')
          EOF
          python3 dl.py "${{ github.event.inputs.extra }}" "${{ github.event.inputs.av }}" "${{ github.event.inputs.ef17 }}" "${{ github.event.inputs.backport }}" | tee ../out/mods.txt
          if [ "${{ github.event.inputs.ef17 }}" = "true" ]; then
            curl -fsSL -o mods/epic-fight-20.14.17.jar "https://cursemaven.com/curse/maven/epic-fight-mod-405076/8049910/epic-fight-mod-405076-8049910.jar"
            echo "curse epic-fight-mod-405076:8049910 (Epic Fight 20.14.17)" | tee -a ../out/mods.txt
          fi
          if [ "${{ github.event.inputs.av }}" = "true" ]; then
            # чего нет на Modrinth — ближайшие версии с curse maven (с ними собран EpicFight: Annoying Villagers)
            fallback() {
              case "$1" in
                AnnoyingVillagers*) echo annoying-villagers-1717848:9036954 ;;
                CombatEvolution*) echo combat-evolution-1377795:9015624 ;;
                epicfight_awaken*) echo epicfight-awaken-1423319:8506984 ;;
                "EpicFight Nightfall"*) echo epicfight-nightfall-1307848:8366962 ;;
                epic_fight_avalon*) echo epic-fight-avalon-1268823:7619938 ;;
                epic-fight-invincible*) echo epic-fight-invincible-1184379:7679941 ;;
                aaa_particles*) echo aaa-particles-979809:8082320 ;;
                WeaponsOfMiracles*) echo weapons-of-miracles-epicfight-918614:7517612 ;;
                *) echo "" ;;
              esac
            }
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              c=$(fallback "$name")
              if [ -z "$c" ]; then echo "NO SOURCE for $name" | tee -a ../out/mods.txt; continue; fi
              n=${c%%:*}; id=${c##*:}
              curl -fsSL -o "mods/$n.jar" "https://cursemaven.com/curse/maven/$n/$id/$n-$id.jar"
              echo "curse $c (instead of $name)" | tee -a ../out/mods.txt
            done < ../out/missing.txt
          fi
          ls -la mods
          echo "eula=true" > eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\nview-distance=4\nspawn-monsters=false\nspawn-animals=false\n' > server.properties
      - name: Run server
        run: |
          cd server
          FV=$(cat ../out/forge_version.txt)
          mkfifo console
          (tail -f console | java -Xmx3G @user_jvm_args.txt @libraries/net/minecraftforge/forge/1.20.1-$FV/unix_args.txt nogui > ../out/server.out 2>&1) &
          sleep 2
          for i in $(seq 1 240); do
            if grep -q 'Done (' logs/latest.log 2>/dev/null; then echo STARTED > ../out/result.txt; break; fi
            if grep -q 'Crash report saved\|Failed to start the minecraft server\|Exception in server tick loop' ../out/server.out logs/latest.log 2>/dev/null; then echo FAILED > ../out/result.txt; break; fi
            sleep 5
          done
          [ -f ../out/result.txt ] || echo TIMEOUT > ../out/result.txt
          if grep -q STARTED ../out/result.txt; then
            if [ -f mods/ba_martialarts_selftest.jar ]; then
              for i in $(seq 1 120); do
                if grep -q '\[SELFTEST\] DONE' logs/latest.log 2>/dev/null; then break; fi
                if grep -q 'Crash report saved\|Exception in server tick loop' ../out/server.out logs/latest.log 2>/dev/null; then break; fi
                sleep 5
              done
              grep -o '\[SELFTEST\] DONE.*' logs/latest.log >> ../out/result.txt || echo "SELFTEST NOT FINISHED" >> ../out/result.txt
            fi
            sleep 3
            echo "reload" > console
            sleep 15
            echo "stop" > console
            sleep 20
          fi
          pkill -f unix_args.txt || true
          pkill -f "tail -f console" || true
          cp logs/latest.log ../out/ 2>/dev/null || true
          cp logs/debug.log ../out/ 2>/dev/null || true
          cp -r crash-reports ../out/ 2>/dev/null || true
          cp config/ba_martialarts-common.toml ../out/ 2>/dev/null || true
          cp selftest-report.txt ../out/ 2>/dev/null || true
          grep -n "ba_martialarts\|bamartial\|SELFTEST\|ERROR\|Exception\|Caused by" ../out/debug.log 2>/dev/null | head -800 > ../out/summary.txt || true
          cat ../out/result.txt
          grep -q STARTED ../out/result.txt
          if [ -f mods/ba_martialarts_selftest.jar ]; then grep -q 'DONE PASS' ../out/result.txt; fi
      - name: Publish logs to 'smoke' branch
        if: always()
        run: |
          cd out
          git init -q -b smoke
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Smoke ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smoke
