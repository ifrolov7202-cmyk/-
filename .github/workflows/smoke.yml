name: Smoke test server

on:
  workflow_dispatch:
    inputs:
      extra:
        description: "Also load Battle Arts and Weapons of Miracles"
        default: "true"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Get built mod
        run: |
          git clone -q --depth 1 -b builds "https://github.com/${{ github.repository }}.git" built
          ls -la built
      - name: Install Forge server and mods
        run: |
          mkdir -p server/mods out
          cd server
          for FV in 47.4.28 47.4.10 47.4.0 47.3.0; do
            if curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-$FV/forge-1.20.1-$FV-installer.jar"; then echo "$FV" > ../out/forge_version.txt; break; fi
          done
          java -jar installer.jar --installServer > ../out/installer.log 2>&1 || (tail -50 ../out/installer.log; exit 1)
          cp ../built/ba_martialarts.jar mods/
          cat > dl.py <<'EOF'
          import json, sys, urllib.request
          def versions(project):
              with urllib.request.urlopen(f"https://api.modrinth.com/v2/project/{project}/version") as r:
                  return json.load(r)
          def get(project, pred, name):
              for v in versions(project):
                  if 'forge' in v['loaders'] and '1.20.1' in v['game_versions'] and pred(v['version_number']):
                      f = next((f for f in v['files'] if f.get('primary')), v['files'][0])
                      urllib.request.urlretrieve(f['url'], 'mods/' + f['filename'])
                      print(name, v['version_number'], f['filename'])
                      return
              print('NOT FOUND', name); sys.exit(1)
          get('epic-fight', lambda n: n.startswith('20.14.16'), 'Epic Fight')
          get('7baP43pD', lambda n: n.startswith('20.14.16'), 'Battle Arts API')
          if sys.argv[1] == 'true':
              get('Dd6vT4jF', lambda n: n.startswith('20.14.16.10'), 'Battle Arts')
              get('weapons-of-miracles', lambda n: n.startswith('2.0.171'), 'Weapons of Miracles')
          EOF
          python3 dl.py "${{ github.event.inputs.extra }}" | tee ../out/mods.txt
          ls -la mods
          echo "eula=true" > eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\nview-distance=4\n' > server.properties
      - name: Run server
        run: |
          cd server
          FV=$(cat ../out/forge_version.txt)
          mkfifo console
          (tail -f console | java -Xmx3G @user_jvm_args.txt @libraries/net/minecraftforge/forge/1.20.1-$FV/unix_args.txt nogui > ../out/server.out 2>&1) &
          sleep 2
          for i in $(seq 1 240); do
            if grep -q 'Done (' logs/latest.log 2>/dev/null; then echo STARTED > ../out/result.txt; break; fi
            if grep -q 'Crash report saved\|Failed to start the minecraft server\|Exception in server tick loop' ../out/server.out logs/latest.log 2>/dev/null; then echo FAILED > ../out/result.txt; break; fi
            sleep 5
          done
          [ -f ../out/result.txt ] || echo TIMEOUT > ../out/result.txt
          if grep -q STARTED ../out/result.txt; then
            sleep 5
            echo "reload" > console
            sleep 15
            echo "stop" > console
            sleep 20
          fi
          pkill -f unix_args.txt || true
          pkill -f "tail -f console" || true
          cp logs/latest.log ../out/ 2>/dev/null || true
          cp logs/debug.log ../out/ 2>/dev/null || true
          cp -r crash-reports ../out/ 2>/dev/null || true
          cp config/ba_martialarts-common.toml ../out/ 2>/dev/null || true
          grep -n "ba_martialarts\|bamartial\|ERROR\|Exception\|Caused by" ../out/debug.log 2>/dev/null | head -600 > ../out/summary.txt || true
          cat ../out/result.txt
      - name: Publish logs to 'smoke' branch
        if: always()
        run: |
          cd out
          git init -q -b smoke
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Smoke ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smoke
