modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="epicfight"
    mandatory=true
    versionRange="[20.14,20.15)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="battlearts_api"
    mandatory=true
    versionRange="[20.14.16,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="battle_arts"
    mandatory=false
    versionRange="[20.14,)"
    ordering="AFTER"
    side="BOTH"

